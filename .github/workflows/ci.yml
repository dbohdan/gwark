name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build and verify (Ubuntu, GHC 9.6.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'

      - name: Cache cabal store and dist-newstyle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: cabal update
        run: cabal update

      # CI builds with optimization disabled to keep the runner
      # under the free-tier minutes budget. Local developer builds
      # keep the cabal default (-O1).
      - name: cabal build all (no optimization)
        run: cabal build all --disable-optimization

      # 'cabal list-bin' must be told the same flags as 'cabal
      # build' or it points at the wrong dist-newstyle subtree.
      # The 'awk' filter strips any leading chatter ('HEAD is
      # now at ...' from a fresh cabal store) so only the path
      # remains.
      - name: Smoke conversion
        run: |
          gwark_bin=$(cabal list-bin --disable-optimization gwark-cli:exe:gwark | awk 'NF{p=$0} END{print p}')
          "$gwark_bin" --version
          out=$(echo '# Hi' | "$gwark_bin" -f markdown -t html5)
          test "$out" = '<h1 id="hi">Hi</h1>'

      # 'cabal exec' writes a GHC environment file that lists
      # 'gwark' as a hidden package; '-package gwark' exposes it
      # so the verify scripts' 'import Text.Pandoc' resolves.
      - name: Verify API surface compiles
        run: cabal exec -- ghc -fno-code -package gwark verify/ApiSurface.hs

      # Compile-and-run rather than 'runghc'. runghc has its own
      # arg-parsing rules and silently mishandles '-package gwark'
      # on some GHC versions, leaving the package hidden and
      # then complaining that 'main' is not in scope.
      #
      # LANG is pinned so the script's UTF-8 output (the sample
      # contains a few non-ASCII characters in the rendered HTML)
      # doesn't fail commitAndReleaseBuffer in a C-locale shell.
      - name: Run roundtrip smoke test
        env:
          LANG: C.UTF-8
        run: |
          mkdir -p dist-newstyle/verify
          cabal exec -- ghc -O0 -package gwark \
            -outputdir dist-newstyle/verify \
            -o dist-newstyle/verify/Roundtrip \
            verify/Roundtrip.hs
          dist-newstyle/verify/Roundtrip > /dev/null
